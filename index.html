          </div>

          {ING_CAT_ORDER.map(cat => {
            const items = grouped[cat];
            if (!items.length) return null;
            return (
              <div key={cat}>
                <div className="shared-cat" style={{background: CAT_COLORS_SHARED[cat]}}>{cat}</div>
                {items.map(item => (
                  <div
                    key={item.key}
                    className={`shared-ing${ckd.has(item.key)?' done':''}`}
                    onClick={()=>togCkd(item.key)}
                  >
                    <div className="shared-ing-cb"><ICON.Check/></div>
                    <span className="shared-ing-text">{item.ing}</span>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}

      <div className="shared-footer">
        Shared from Family Clean Eats · familycleaneats.app
      </div>
    </div>
  );
}

/* ── Password Modal ── */
function PasswordModal({onAuth, onCancel}) {
  const [pw, setPw] = React.useState('');
  const [err, setErr] = React.useState(false);
  const check = () => {
    if (pw === FAMILY_PASSWORD) { onAuth(); }
    else { setErr(true); setPw(''); }
  };
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:9999}} onClick={onCancel}>
      <div style={{background:'var(--card)',borderRadius:20,padding:28,width:300,boxShadow:'0 8px 32px rgba(0,0,0,0.18)'}} onClick={e=>e.stopPropagation()}>
        <div style={{fontFamily:'var(--ff-serif)',fontSize:22,color:'var(--fg)',marginBottom:8}}>Family password</div>
        <div style={{fontSize:14,color:'var(--fg-muted)',marginBottom:18}}>Enter the password to add or edit recipes.</div>
        <input
          type="password" value={pw} autoFocus
          onChange={e=>{setPw(e.target.value);setErr(false);}}
          onKeyDown={e=>e.key==='Enter'&&check()}
          placeholder="Password"
          style={{width:'100%',padding:'12px 14px',borderRadius:10,border:'1.5px solid var(--rule-strong)',background:'var(--bg)',fontSize:16,outline:'none',marginBottom:err?8:18}}
        />
        {err && <div style={{color:'var(--destructive)',fontSize:13,marginBottom:12}}>Wrong password — try again.</div>}
        <div style={{display:'flex',gap:10}}>
          <button className="btn" style={{flex:1}} onClick={onCancel}>Cancel</button>
          <button className="btn pr" style={{flex:2}} onClick={check}>Unlock</button>
        </div>
      </div>
    </div>
  );
}

/* ── App ── */
function App() {
  const initRef = useRef();
  initRef.current ??= loadAll();
  const init = initRef.current;
  const [meals, setMeals] = useState([]);
  const [loading, setLoading] = useState(true);
  const [authed, setAuthed] = useState(() => sessionStorage.getItem('fce-authed') === '1');
  const [pwPrompt, setPwPrompt] = useState(null);
  const [favs, setFavs]   = useState(init.favs);
  const [sel, setSel]     = useState(init.sel);
  const [ckd, setCkd]     = useState(init.ckd);
  const [plan, setPlan]   = useState(init.plan);
  const [customItems, setCustomItems] = useState(init.customItems);
  const [view, setView]   = useState('library');
  const [detail, setDetail] = useState(null);
  const [cookMode, setCookMode] = useState(null);
  const [editM, setEditM]   = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [importOpen, setImportOpen] = useState(false);
  const {msg, vis, toast} = useToast();
  const searchRef = useRef(null);

  // Detect shared link
  const [sharedData] = useState(()=>{
    try {
      const h = window.location.hash;
      if (h.startsWith('#weekly=')) return JSON.parse(atob(h.slice(8)));
    } catch {}
    return null;
  });

  const sbSynced = React.useRef(false);
  useEffect(()=>{
    const defaultPlan = Object.fromEntries(DAYS.map(d=>[d,{lunch:null,dinner:null}]));
    Promise.all([
      loadMeals(),
      loadSetting('plan', defaultPlan),
      loadSetting('shopping_sel', []),
      loadSetting('shopping_custom', []),
    ]).then(([m, p, s, c]) => {
      setMeals(m);
      setPlan(p);
      setSel(new Set(s));
      setCustomItems(c);
      sbSynced.current = true;
      setLoading(false);
    });
  }, []);
  useEffect(()=>saveFavs(favs), [favs]);
  useEffect(()=>saveCkd(ckd), [ckd]);
  useEffect(()=>{ if(sbSynced.current) saveSetting('plan', plan); }, [plan]);
  useEffect(()=>{ if(sbSynced.current) saveSetting('shopping_sel', [...sel]); }, [sel]);
  useEffect(()=>{ if(sbSynced.current) saveSetting('shopping_custom', customItems); }, [customItems]);

  const togSel = id => setSel(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const togFav = id => setFavs(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const togCkd = k  => setCkd(s => { const n = new Set(s); n.has(k) ? n.delete(k) : n.add(k); return n; });

  const planDay = (d, id, slot) => {
    setPlan(p => ({...p, [d]: {...p[d], [slot]: id}}));
    const already = sel.has(id);
    if (!already) setSel(s => new Set(s).add(id));
    const meal = meals.find(m => m.id === id);
    if (meal) toast(already ? `✓ ${meal.name} planned for ${d}` : `✓ Added to ${d} & shopping`);
  };

  const authGuard = cb => { if (authed) { cb(); } else { setPwPrompt(() => cb); } };

  const saveR = async m => {
    const saveErr = await upsertMeal(m);
    if (saveErr) {
      toast('Save failed: ' + String(saveErr).slice(0, 80));
      return;
    }
    setMeals(ms => { const i = ms.findIndex(x => x.id === m.id); return i >= 0 ? ms.map(x => x.id === m.id ? m : x) : [...ms, m]; });
    setEditM(null); setView('library');
    toast(editM ? '✓ Recipe updated' : '✓ Recipe saved!');
  };

  const delR = async id => {
    if (!confirm('Delete this recipe?')) return;
    await deleteMeal(id);
    setMeals(ms => ms.filter(m => m.id !== id));
    setSel(s => { const n = new Set(s); n.delete(id); return n; });
    setFavs(s => { const n = new Set(s); n.delete(id); return n; });
    setPlan(p => { const n = {...p}; for (const d of DAYS) { const s = n[d]||{}; n[d] = {lunch: s.lunch===id?null:s.lunch, dinner: s.dinner===id?null:s.dinner}; } return n; });
    setDetail(null); toast('Recipe deleted');
  };

  const shareWeek = async () => {
    const planned = [];
    DAYS.forEach(d => {
      ['lunch','dinner'].forEach(slot => {
        const id = plan[d]?.[slot];
        if (id) {
          const m = meals.find(x => x.id === id);
          if (m) planned.push({day: d, slot, name: m.name, sub: m.subcategory, time: m.cookingTime || '', ingredients: m.ingredients});
        }
      });
    });
    if (!planned.length) return;

    // Build url with embedded JSON for shared link
    const data = {ts: Date.now().toString(36), days: planned};
    const url = window.location.origin + window.location.pathname + '#weekly=' + btoa(JSON.stringify(data));

    const lines = [`🍽 This week's meals`, ''];
    planned.forEach(p => lines.push(`${DAY_FULL[p.day]} — ${p.name}${p.time ? ' (' + p.time + ')' : ''}`));
    lines.push('', '🛒 Shopping list', '');
    const grouped = {};
    ING_CAT_ORDER.forEach(c => grouped[c] = []);
    planned.forEach(p => p.ingredients.forEach(ing => grouped[categorizeIng(ing)].push(ing)));
    ING_CAT_ORDER.forEach(c => grouped[c] = [...new Set(grouped[c])]);
    for (const cat of ING_CAT_ORDER) {
      if (!grouped[cat].length) continue;
      lines.push(cat.toUpperCase());
      grouped[cat].forEach(ing => lines.push('• ' + ing));
      lines.push('');
    }
    lines.push('Tick items off as you shop:', url);
    const txt = lines.join('\n');

    if (navigator.share) {
      try { await navigator.share({title: "This week's meals", text: txt, url}); return; } catch(e) {}
    }
    try { await navigator.clipboard.writeText(txt); toast('✓ Copied! Paste into a message.'); }
    catch {
      const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      toast('✓ Copied! Paste into a message.');
    }
  };

  const exportLib = () => {
    if (!meals.length) { alert('No recipes to export!'); return; }
    const b = new Blob([JSON.stringify({exported: new Date().toISOString(), version: 5, meals}, null, 2)], {type: 'application/json'});
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u; a.download = `family-clean-eats-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(u);
    toast('✓ Downloaded!');
  };

  const importLib = e => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        const inc = data.meals || (Array.isArray(data) ? data : []);
        if (!inc.length) { alert('No recipes found in this file.'); return; }
        setMeals(ms => {
          const ex = new Set(ms.map(m => m.name.toLowerCase().trim()));
          const fresh = inc.filter(m => !ex.has(m.name.toLowerCase().trim()));
          toast(`✓ Added ${fresh.length} recipes${inc.length - fresh.length ? ` (${inc.length - fresh.length} skipped)` : ''}`);
          return [...ms, ...fresh];
        });
      } catch { alert('Could not read this file.'); }
      e.target.value = '';
    };
    r.readAsText(file);
  };

  const exportNotes = async () => {
    const sm = meals.filter(m => sel.has(m.id)); if (!sm.length) return;
    const grouped = {}; ING_CAT_ORDER.forEach(c => grouped[c] = []);
    sm.forEach(m => m.ingredients.forEach(ing => grouped[categorizeIng(ing)].push(ing)));
    const date = new Date().toLocaleDateString('en-AU', {weekday:'long', day:'numeric', month:'long'});
    const lines = ['Shopping List', date, '', 'Meals: ' + sm.map(m => m.name).join(', '), ''];
    for (const cat of ING_CAT_ORDER) {
      if (!grouped[cat].length) continue;
      lines.push(cat.toUpperCase());
      grouped[cat].forEach(ing => lines.push(ing));
      lines.push('');
    }
    const txt = lines.join('\n');
    if (navigator.share) { try { await navigator.share({title: 'Shopping List', text: txt}); return; } catch(e) {} }
    try { await navigator.clipboard.writeText(txt); } catch(err) {
      const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    }
    toast('✓ Copied! Paste into Apple Notes.');
  };

  const importNotes = (txt, done) => {
    if (!txt.trim()) { alert('Please paste your recipes first.'); return; }
    const CAT_KEYS = Object.keys(CATS);
    const matchCat = v => {
      const t = (v||'').trim(); if (!t) return ['Dinner', false];
      const h = CAT_KEYS.find(k => k.toLowerCase() === t.toLowerCase());
      return [h || 'Dinner', !h];
    };
    const matchSub = (cat, v) => {
      const subs = CATS[cat] || []; const t = (v||'').trim(); if (!t) return ['Other', false];
      const h = subs.find(s => s.toLowerCase() === t.toLowerCase());
      return [h || 'Other', !h];
    };
    const parseStructured = blk => {
      const ls = blk.trim().split('\n');
      const m = {id: Date.now()+'-'+Math.random(), name:'', category:'Dinner', subcategory:'Other', cookingTime:'', servings:'', recipe:'', ingredients:[], notes:''};
      let rawCat = '', rawSub = '', sec = '', rec = [], ings = [];
      for (let raw of ls) {
        const l = raw.trim(); if (!l) continue;
        if (/^(Name|Meal):\s*/i.test(l))      m.name = l.replace(/^(Name|Meal):\s*/i, '');
        else if (/^Category:\s*/i.test(l))    rawCat = l.replace(/^Category:\s*/i, '');
        else if (/^Subcategory:\s*/i.test(l)) rawSub = l.replace(/^Subcategory:\s*/i, '');
        else if (/^Time:\s*/i.test(l))        m.cookingTime = l.replace(/^Time:\s*/i, '');
        else if (/^Servings:\s*/i.test(l))    m.servings = l.replace(/^Servings:\s*/i, '');
        else if (/^Notes:\s*/i.test(l))       { m.notes = l.replace(/^Notes:\s*/i, ''); sec = ''; }
        else if (/^Recipe:\s*$/i.test(l))     sec = 'r';
        else if (/^Ingredients:\s*$/i.test(l)) sec = 'i';
        else if (sec === 'r') rec.push(l);
        else if (sec === 'i') ings.push(l);
      }
      m._rawCat = rawCat; m._rawSub = rawSub;
      m.recipe = rec.join(' '); m.ingredients = ings.filter(Boolean); return m;
    };
    const parseSmart = blk => {
      const lines = blk.trim().split('\n').map(s=>s.trim()).filter(Boolean);
      if (!lines.length) return null;
      const isJunk = l => /^(?:page\s*\d+|\d+\s*$|photograph\s+by|recipe\s+by|from\s+the\s+kitchen|©|copyright|all\s+rights\s+reserved)/i.test(l);
      const isSectionHdr = l => /^(?:method|ingredients?|directions?|instructions?|preparation|prep|steps?|recipe|notes?)[\s:]*$/i.test(l);
      const servingsRx = /(?:^|\s)(?:serves|makes|servings?|portions?|yield)[\s:]+(\d+)/i;
      const timeRx = /(?:prep|cook|cooking|total|ready\s+in)(?:\s*time)?[\s:]+(\d+(?:[.,]\d+)?\s*(?:hours?|hrs?|h\b|minutes?|mins?|m\b))/i;
      const qtyStartRx = /^(?:\d+(?:[.,/]\d+)?|\d+\s*-\s*\d+|[¼½¾⅓⅔⅛⅜⅝⅞]|a\s+(?:pinch|dash|handful|few)\b|an?\s)/i;
      const unitRx = /\b(?:cups?|tbsps?|tablespoons?|tsps?|teaspoons?|grams?|kilograms?|g|kg|mls?|millilitres?|millile?ters?|litres?|liters?|l|oz|ounces?|lbs?|pounds?|pinch(?:es)?|dash(?:es)?|cloves?|cans?|jars?|sprigs?|slices?|pieces?|sticks?|packets?|bunches?|heads?|bottles?|handful)\b/i;
      const numberedStepRx = /^(?:\d+[.):]|step\s+\d+)/i;
      const verbStartRx = /^(?:heat|add|combine|mix|whisk|stir|simmer|bake|cook|saut[eé]|fry|grill|roast|brown|chop|dice|slice|mince|crush|pour|drain|drizzle|toss|fold|knead|rest|serve|preheat|season|cover|reduce|remove|return|transfer|let|garnish|sprinkle|spread|place|put|cool|chill|refrigerate|freeze|microwave|boil|steam|set\s+aside|once|when|until|in\s+a\s+(?:pan|pot|bowl|dish|skillet))/i;
      const classify = l => {
        if (isJunk(l) || isSectionHdr(l)) return 'junk';
        if (numberedStepRx.test(l)) return 'method';
        if ((servingsRx.test(l) || timeRx.test(l)) && l.length < 50) return 'meta';
        if (qtyStartRx.test(l) && l.length < 100) return 'ingredient';
        if (unitRx.test(l) && l.length < 60) return 'ingredient';
        if (l.length > 80) return 'method';
        if (verbStartRx.test(l) && l.length > 12) return 'method';
        return 'unknown';
      };
      const classes = lines.map(classify);
      let servings = '', cookTime = '';
      for (let i = 0; i < lines.length; i++) {
        if (classes[i] !== 'meta') continue;
        const sm = lines[i].match(servingsRx); if (sm && !servings) servings = sm[1];
        const tm = lines[i].match(timeRx); if (tm && !cookTime) cookTime = tm[1].replace(/\s+/g, ' ');
      }
      let titleIdx = -1, name = '';
      for (let i = 0; i < Math.min(lines.length, 8); i++) {
        const c = classes[i];
        if (c === 'junk') continue;
        if (c === 'ingredient' || c === 'method') break;
        if (c === 'meta') continue;
        if (lines[i].length > 70) continue;
        name = lines[i]; titleIdx = i; break;
      }
      const ings = [], methodParts = [];
      let sawIng = false, sawMethod = false;
      for (let i = 0; i < lines.length; i++) {
        if (i === titleIdx) continue;
        const l = lines[i], c = classes[i];
        if (c === 'junk' || c === 'meta') continue;
        if (c === 'ingredient') { ings.push(l); sawIng = true; }
        else if (c === 'method') { methodParts.push(l); sawMethod = true; }
        else {
          if (sawMethod) methodParts.push(l);
          else if (sawIng && l.length < 60) ings.push(l);
          else if (sawIng) methodParts.push(l);
        }
      }
      if (!ings.length && !methodParts.length) return null;
      if (!name) name = 'Untitled recipe';
      return {
        id: Date.now() + '-' + Math.random(),
        name, category: 'Dinner', subcategory: 'Other',
        cookingTime: cookTime, servings,
        recipe: methodParts.join(' '),
        ingredients: ings,
        notes: '', _smart: true,
      };
    };
    let adjusted = 0, smartCount = 0;
    const parsed = txt.split(/={3,}|-{3,}/).map(blk => {
      if (!blk.trim()) return null;
      let m = parseStructured(blk);
      if (!(m.name && m.ingredients.length)) {
        m = parseSmart(blk);
        if (m) smartCount++;
      }
      if (!m) return null;
      const [cat, catAdj] = matchCat(m._rawCat || m.category); m.category = cat;
      const [sub, subAdj] = matchSub(cat, m._rawSub || m.subcategory); m.subcategory = sub;
      if (catAdj || subAdj) adjusted++;
      delete m._rawCat; delete m._rawSub; delete m._smart;
      return m;
    }).filter(m => m && m.name && m.ingredients.length);
    if (!parsed.length) { alert("Couldn't find a recipe in that text. Try a clearer photo or paste with more detail."); return; }
    setMeals(ms => [...ms, ...parsed]);
    done && done();
    const bits = [];
    if (adjusted) bits.push(`${adjusted} adjusted`);
    if (smartCount) bits.push(`${smartCount} auto-parsed — review category`);
    const note = bits.length ? ` (${bits.join(', ')})` : '';
    toast(`✓ Imported ${parsed.length} recipe${parsed.length!==1?'s':''}${note}!`);
  };

  const isForm = view === 'add' || view === 'edit';

  if (sharedData) return <SharedView data={sharedData}/>;
  if (loading) return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100dvh',gap:16,background:'var(--bg)'}}>
      <div style={{fontSize:32}}>🍽️</div>
      <div style={{fontFamily:'var(--ff-serif)',fontSize:20,color:'var(--primary)'}}>Loading recipes…</div>
    </div>
  );

  return (
    <>
      <header className="hdr">
        {isForm ? (
          <button className="hdr-btn" onClick={()=>{setEditM(null); setView('library');}} aria-label="Back">
            <ICON.Back/>
          </button>
        ) : (
          <button className="hdr-btn" onClick={()=>setMenuOpen(true)} aria-label="Menu">
            <ICON.Menu/>
          </button>
        )}
        <div className="wm">Family <em>Clean</em> Eats</div>
        {sel.size > 0 && view === 'library' && (
          <div className="hdr-pill">{sel.size}</div>
        )}
        {!isForm && view === 'library' && (
          <button className="hdr-btn" onClick={()=>searchRef.current?.focus()} aria-label="Search">
            <ICON.Search/>
          </button>
        )}
      </header>

      {view === 'library' && (
        <Library
          meals={meals} favs={favs} sel={sel} plan={plan}
          onChk={togSel} onFav={togFav} onOpen={m => setDetail(m)}
          onAdd={()=>authGuard(()=>{setEditM(null); setView('add');})}
          onImport={importNotes}
          onClearSel={()=>setSel(new Set())}
          searchRef={searchRef}
          onShowImp={()=>setImportOpen(true)}
        />
      )}
      {view === 'plan' && (
        <Plan
          meals={meals} plan={plan}
          onSet={planDay} onClear={(d,slot) => setPlan(p => ({...p, [d]: {...p[d], [slot]: null}}))} onShare={shareWeek}
        />
      )}
      {view === 'shopping' && (
        <Shopping
          meals={meals} sel={sel} ckd={ckd}
          customItems={customItems}
          onAddCustom={text => setCustomItems(ci => [...ci, {id: Date.now()+'-'+Math.random(), text}])}
          onDelCustom={id => setCustomItems(ci => ci.filter(x => x.id !== id))}
          onTog={togCkd} onExport={exportNotes} onClearCkd={()=>setCkd(new Set())}
        />
      )}
      {view === 'share' && (
        <Share count={meals.length} onExport={exportLib} onImport={importLib} onShareWeek={shareWeek} hasPlan={DAYS.some(d => plan[d]?.lunch || plan[d]?.dinner)}/>
      )}
      {isForm && (
        <AddEdit init={editM} onSave={saveR} onCancel={()=>{setEditM(null); setView('library');}}/>
      )}

      {detail && (
        <Detail
          meal={detail} fav={favs.has(detail.id)} sel={sel.has(detail.id)}
          meals={meals}
          onOpen={m=>setDetail(m)}
          onClose={()=>setDetail(null)}
          onFav={togFav} onSel={togSel}
          onEdit={()=>authGuard(()=>{setEditM(detail); setDetail(null); setView('edit');})}
          onDel={()=>authGuard(()=>delR(detail.id))}
          onCook={()=>{ setCookMode(detail); setDetail(null); }}
          onCopyIngs={async()=>{
            const txt = detail.ingredients.join('\n');
            try { await navigator.clipboard.writeText(txt); } catch {
              const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
              document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
            }
            toast('✓ Ingredients copied!');
          }}
        />
      )}

      {cookMode && (
        <CookMode meal={cookMode} onClose={()=>setCookMode(null)} />
      )}

      {menuOpen && (
        <HeaderMenu
          onClose={()=>setMenuOpen(false)}
          onAdd={()=>authGuard(()=>{setEditM(null); setView('add');})}
          onImport={()=>setImportOpen(true)}
          onExport={exportLib}
          onSharePlan={shareWeek}
          hasPlan={DAYS.some(d => plan[d])}
        />
      )}

      {importOpen && (
        <ImportSheet onClose={()=>setImportOpen(false)} onImport={importNotes} toast={toast}/>
      )}
      {pwPrompt && (
        <PasswordModal
          onAuth={()=>{ setAuthed(true); sessionStorage.setItem('fce-authed','1'); const cb=pwPrompt; setPwPrompt(null); cb(); }}
          onCancel={()=>setPwPrompt(null)}
        />
      )}

      {!isForm && (
        <nav className="bnav">
          <button className={`ntab${view==='library'?' on':''}`} onClick={()=>{setDetail(null); setView('library');}}>
            <ICON.Book/>
            <span>Library</span>
          </button>
          <button className={`ntab${view==='plan'?' on':''}`} onClick={()=>{setDetail(null); setView('plan');}}>
            <ICON.Cal/>
            <span>Plan</span>
          </button>
          <button className="nfab" onClick={()=>authGuard(()=>{setDetail(null); setEditM(null); setView('add');})} aria-label="Add recipe">
            <div className="nfab-inner"><ICON.Plus/></div>
          </button>
          <button className={`ntab${view==='shopping'?' on':''}`} onClick={()=>{setDetail(null); setView('shopping');}}>
            <ICON.Cart/>
            <span>Shop</span>
            {sel.size > 0 && <div className="nbadge">{sel.size}</div>}
          </button>
          <button className={`ntab${view==='share'?' on':''}`} onClick={()=>{setDetail(null); setView('share');}}>
            <ICON.Share/>
            <span>Share</span>
          </button>
        </nav>
      )}

      <div className={`toast${vis?' show':''}`}>{msg}</div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
