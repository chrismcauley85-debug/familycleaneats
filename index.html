              </li>
            ))}
          </ul>

          {methodParas.length > 0 && (
            <>
              <div className="sheet-sec">Method</div>
              <div className="method">
                {methodParas.map((p,i) => <p key={i}>{p}</p>)}
              </div>
            </>
          )}

          {meal.notes && (
            <>
              <div className="sheet-sec">Cook's note</div>
              <div className="notes-box">{meal.notes}</div>
            </>
          )}
        </div>

        <div className="sheet-foot">
          <div className="row">
            <button className={`btn${sel?' tl':' pr'}`} onClick={()=>onSel(meal.id)}>
              {sel ? <><ICON.Check/> In shop list</> : <><ICON.Cart/> Add to shop</>}
            </button>
            <button
              className="btn"
              onClick={()=>onFav(meal.id)}
              style={fav?{borderColor:'var(--mustard)',color:'var(--mustard)',background:'var(--parchment)'}:{}}
            >
              {fav ? '★ Saved' : '☆ Favourite'}
            </button>
          </div>
          <div className="row">
            <button className="btn sm" onClick={onCopyIngs}><ICON.Copy/> Copy ingredients</button>
            <button className="btn sm" onClick={onEdit}>Edit</button>
            <button className="btn sm dn" onClick={onDel}><ICON.Trash/></button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Add / Edit form ── */
function AddEdit({init, onSave, onCancel}) {
  const blank = {name:'',category:'Dinner',subcategory:'Dutchoven',cookingTime:'',servings:'',recipe:'',ingredients:'',notes:'',cuisine:'',meatType:''};
  const [f, setF] = useState(()=>init ? {...init, ingredients: init.ingredients.join('\n')} : blank);
  const subs = CATS[f.category] || [];
  useEffect(()=>{
    const s = CATS[f.category] || [];
    if (!s.includes(f.subcategory)) setF(x=>({...x, subcategory: s[0]}));
  }, [f.category, f.subcategory]);
  const set = (k, v) => setF(x => ({...x, [k]: v}));
  const save = () => {
    if (!f.name.trim()) { alert('Please enter a recipe name.'); return; }
    const ings = f.ingredients.split('\n').map(s=>s.trim()).filter(Boolean);
    if (!ings.length) { alert('Please add at least one ingredient.'); return; }
    onSave({
      id: init ? init.id : Date.now()+'-'+Math.random(),
      name: f.name.trim(),
      category: f.category,
      subcategory: f.subcategory,
      cookingTime: f.cookingTime.trim(),
      servings: f.servings.trim(),
      recipe: f.recipe.trim(),
      ingredients: ings,
      notes: f.notes.trim(),
      cuisine: f.cuisine || '',
      meatType: f.meatType || '',
    });
  };

  return (
    <div>
      <div className="form-hero">
        <div className="form-eye">{init ? 'Edit recipe' : 'New recipe'}</div>
        <div className="form-title">{f.name || (init ? 'Edit recipe' : 'Add a recipe')}</div>
      </div>
      <div className="form-body">
        <div className="fld">
          <label>Recipe name</label>
          <input type="text" value={f.name} onChange={e=>set('name', e.target.value)} placeholder="e.g. Dutch Oven Pot Roast"/>
        </div>
        <div className="frow">
          <div className="fld">
            <label>Category</label>
            <select value={f.category} onChange={e=>set('category', e.target.value)}>
              <option>Dinner</option><option>Lunch</option>
            </select>
          </div>
          <div className="fld">
            <label>Method</label>
            <select value={f.subcategory} onChange={e=>set('subcategory', e.target.value)}>
              {subs.map(s => <option key={s} value={s}>{s === 'Dutchoven' ? 'Dutch oven' : s}</option>)}
            </select>
          </div>
        </div>
        <div className="frow">
          <div className="fld">
            <label>Cooking time</label>
            <input type="text" value={f.cookingTime} onChange={e=>set('cookingTime', e.target.value)} placeholder="2 hrs"/>
          </div>
          <div className="fld">
            <label>Servings</label>
            <input type="text" value={f.servings} onChange={e=>set('servings', e.target.value)} placeholder="4"/>
          </div>
        </div>
        <div className="fld">
          <label>Method</label>
          <textarea rows={5} value={f.recipe} onChange={e=>set('recipe', e.target.value)} placeholder="Step-by-step. Two blank lines separates paragraphs."/>
        </div>
        <div className="fld">
          <label>Ingredients — one per line</label>
          <textarea rows={6} value={f.ingredients} onChange={e=>set('ingredients', e.target.value)} placeholder={"2 tbsp olive oil\n1 kg beef chuck\n2 carrots, chopped"}/>
        </div>
        <div className="fld">
          <label>Cook's note (optional)</label>
          <input type="text" value={f.notes} onChange={e=>set('notes', e.target.value)} placeholder="Tips, substitutions, serving ideas…"/>
        </div>
        <div className="frow">
          <div className="fld">
            <label>Cuisine (optional)</label>
            <select value={f.cuisine} onChange={e=>set('cuisine', e.target.value)}>
              <option value="">Auto-detect</option>
              {CUISINES.map(c => <option key={c}>{c}</option>)}
            </select>
          </div>
          <div className="fld">
            <label>Protein (optional)</label>
            <select value={f.meatType} onChange={e=>set('meatType', e.target.value)}>
              <option value="">Auto-detect</option>
              {MEAT_TYPES.map(t => <option key={t}>{t}</option>)}
            </select>
          </div>
        </div>
      </div>
      <div className="form-acts">
        <button className="btn" onClick={onCancel} style={{flex:1}}>Cancel</button>
        <button className="btn pr" onClick={save} style={{flex:2}}>
          {init ? 'Save changes' : 'Add recipe'}
        </button>
      </div>
    </div>
  );
}

/* ── Plan ── */
function Plan({meals, plan, onSet, onClear, onShare}) {
  const [picker, setPicker] = useState(null);
  const [cat, setCat] = useState('All');
  const todayIdx = (new Date().getDay()+6)%7;
  const today = DAYS[todayIdx];
  const pm = cat === 'All' ? meals : meals.filter(m => m.category === cat);
  const planned = DAYS.filter(d => plan[d]).length;
  const totalIngs = DAYS.reduce((s, d) => {
    const m = meals.find(x => x.id === plan[d]);
    return s + (m?.ingredients.length || 0);
  }, 0);

  return (
    <div className="wrap">
      <PageHero
        tone="plum"
        eye="This week"
        title="Meal plan."
        desc="Lock in dinner. Tap any day to assign a recipe. Shopping list builds automatically."
      />

      <div className="plan-summary">
        <div className="plan-summary-top">
          <div style={{flex:1, minWidth:0}}>
            <div className="plan-summary-eye">Plan summary</div>
            <div className="plan-summary-title">{planned} of 7 dinners planned</div>
          </div>
          {planned > 0 && (
            <button className="btn sm" onClick={onShare}>
              <ICON.Share/> Share
            </button>
          )}
        </div>
        <div className="plan-stats">
          <div className="plan-stat"><div className="n">{planned}</div><div className="l">Planned</div></div>
          <div className="plan-stat"><div className="n">{totalIngs}</div><div className="l">Ingredients</div></div>
          <div className="plan-stat"><div className="n">{7-planned}</div><div className="l">Open</div></div>
        </div>
      </div>

      <div className="plan-week">
        {DAYS.map(d => {
          const m = plan[d] ? meals.find(x => x.id === plan[d]) : null;
          const clr = m ? (SUB_COLORS[m.subcategory] || 'var(--muted)') : 'var(--rule-strong)';
          const isToday = d === today;
          return (
            <div
              key={d}
              className={`plan-day${isToday?' today':''}`}
              onClick={()=>setPicker(d)}
            >
              <div>
                <div className="plan-day-lbl">{d}</div>
                <div className="plan-day-num">{FCC_DAY_NUM[d]}</div>
              </div>
              <div className="plan-day-meal">
                {m ? (
                  <>
                    <div className="plan-day-name">{m.name}</div>
                    <div className="plan-day-sub">{m.subcategory === 'Dutchoven' ? 'Dutch oven' : m.subcategory}{m.cookingTime ? ' · ' + m.cookingTime : ''}</div>
                  </>
                ) : (
                  <div className="plan-day-empty">Nothing planned</div>
                )}
              </div>
              {m ? (
                <div className="plan-day-stripe" style={{background: clr}}/>
              ) : (
                <button className="plan-day-add" onClick={e=>{e.stopPropagation(); setPicker(d);}}>+</button>
              )}
            </div>
          );
        })}
      </div>

      {!meals.length && (
        <div className="empty">
          <h3>No recipes yet</h3>
          <p>Add some recipes in the Library first.</p>
        </div>
      )}

      {picker && (
        <div className="overlay" onClick={()=>setPicker(null)}>
          <div className="sheet" onClick={e=>e.stopPropagation()}>
            <div className="sheet-grab"/>
            <button className="sheet-back" onClick={()=>setPicker(null)}>
              <ICON.Back/> Back
            </button>
            <div className="sheet-hd">
              <div className="sheet-eye" style={{color:'var(--plum)'}}>

function SharedView({data}) {

    'Produce': '#5A7028',
    'Meat & Seafood': '#B23E5A',
    'Dairy & Eggs': '#1A5959',
    'Bakery': '#D9A026',
    'Pantry': '#7A3F5E',
    'Other': '#8A7A6A',
  };
  const storageKey = 'hm-shared-ckd-' + (data.ts || '');
  const [ckd, setCkd] = useState(() => {
    try { return new Set(JSON.parse(sessionStorage.getItem(storageKey) || '[]')); } catch { return new Set(); }
  });
  const togCkd = key => {
    setCkd(prev => {
      const next = new Set(prev);
      next.has(key) ? next.delete(key) : next.add(key);
      try { sessionStorage.setItem(storageKey, JSON.stringify([...next])); } catch {}
      return next;
    });
  };

  const allItems = [];
  data.days.forEach(d => {
    d.ingredients.forEach((ing, i) => {
      allItems.push({key: d.day+'-'+i, ing, cat: categorizeIng(ing)});
    });
  });
  const seen = new Set();
  const dedupedItems = allItems.filter(item => {
    const k = item.ing.toLowerCase().replace(/[^a-z]/g,'').slice(0,15);
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
  const grouped = {};
  ING_CAT_ORDER.forEach(c => { grouped[c] = []; });
  dedupedItems.forEach(item => grouped[item.cat].push(item));

  const doneN = dedupedItems.filter(x => ckd.has(x.key)).length;
  const pct = dedupedItems.length ? Math.round(doneN/dedupedItems.length*100) : 0;

  return (
    <div className="shared">
      <div className="shared-hero">
        <div className="shared-wm">Family <em>Clean</em> Eats</div>
        <div className="shared-sub">This week's plan · tap items to tick off</div>
      </div>

      <div className="shared-section">
        <div className="shared-section-hd">Dinner plan</div>
        {data.days.length === 0 && <div style={{color:'var(--fg-muted)',fontSize:13,padding:'16px 14px'}}>No meals planned yet.</div>}

            <div className="shared-day-pill">
              <div className="d">{d.day}</div>
            </div>
            <div className="shared-day-content">
              <div className="shared-day-name">{d.name}</div>
              <div className="shared-day-sub">{d.sub || ''}{d.time ? ' · ' + d.time : ''}</div>
            </div>
            <div className="shared-day-stripe" style={{background: SUB_COLORS[d.sub] || 'var(--muted)'}}/>
          </div>
        ))}
      </div>

      {dedupedItems.length > 0 && (
        <div className="shared-section">
          <div className="shared-section-hd" style={{color:'var(--plum)'}}>Grocery list</div>
          <div className="shared-prog-card">
            <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',marginBottom:10}}>
              <div>
                <div style={{fontFamily:'var(--mono)',fontSize:10,fontWeight:600,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--plum)',marginBottom:4}}>Progress</div>
                <div style={{fontFamily:'var(--serif)',fontSize:20,color:'var(--fg)'}}>{doneN} of {dedupedItems.length} ticked</div>
              </div>
              <div style={{fontFamily:'var(--serif)',fontStyle:'italic',fontSize:26,color:'var(--destructive)'}}>{pct}<span style={{fontStyle:'normal',fontFamily:'var(--mono)',fontSize:13,color:'var(--fg-muted)'}}>%</span></div>
            </div>
            <div className="prog-track">
              <div className="prog-fill" style={{width:`${pct}%`, background:'var(--plum)'}}/>
            </div>
          </div>

          {ING_CAT_ORDER.map(cat => {
            const items = grouped[cat];
            if (!items.length) return null;
            return (
              <div key={cat}>
                <div className="shared-cat" style={{background: CAT_COLORS_SHARED[cat]}}>{cat}</div>
                {items.map(item => (

                    key={item.key}

            );
          })}
        </div>
      )}

      <div className="shared-footer">
        Shared from Family Clean Eats · familycleaneats.app
      </div>
    </div>
  );
}

/* ── App ── */
function App() {
  const initRef = useRef();
  initRef.current ??= loadAll();
  const init = initRef.current;
  const [meals, setMeals] = useState(init.meals);
  const [favs, setFavs]   = useState(init.favs);
  const [sel, setSel]     = useState(new Set());
  const [ckd, setCkd]     = useState(new Set());
  const [plan, setPlan]   = useState(init.plan);
  const [view, setView]   = useState('library');
  const [detail, setDetail] = useState(null);
  const [editM, setEditM]   = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [importOpen, setImportOpen] = useState(false);
  const {msg, vis, toast} = useToast();
  const searchRef = useRef(null);

  // Detect shared link
  const [sharedData] = useState(()=>{
    try {
      const h = window.location.hash;
      if (h.startsWith('#weekly=')) return JSON.parse(atob(h.slice(8)));
    } catch {}
    return null;
  });

  useEffect(()=>saveMeals(meals), [meals]);
  useEffect(()=>saveFavs(favs), [favs]);
  useEffect(()=>savePlan(plan), [plan]);

  const togSel = id => setSel(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const togFav = id => setFavs(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const togCkd = k  => setCkd(s => { const n = new Set(s); n.has(k) ? n.delete(k) : n.add(k); return n; });

  const planDay = (d, id) => {
    setPlan(p => ({...p, [d]: id}));
    const already = sel.has(id);
    if (!already) setSel(s => new Set(s).add(id));
    const meal = meals.find(m => m.id === id);
    if (meal) toast(already ? `✓ ${meal.name} planned for ${d}` : `✓ Added to ${d} & shopping`);
  };

  const saveR = m => {
    setMeals(ms => { const i = ms.findIndex(x => x.id === m.id); return i >= 0 ? ms.map(x => x.id === m.id ? m : x) : [...ms, m]; });
    setEditM(null); setView('library');
    toast(editM ? '✓ Recipe updated' : '✓ Recipe saved!');
  };

  const delR = id => {
    if (!confirm('Delete this recipe?')) return;
    setMeals(ms => ms.filter(m => m.id !== id));
    setSel(s => { const n = new Set(s); n.delete(id); return n; });
    setFavs(s => { const n = new Set(s); n.delete(id); return n; });
    setPlan(p => { const n = {...p}; for (const d of DAYS) if (n[d] === id) n[d] = null; return n; });
    setDetail(null); toast('Recipe deleted');
  };

  const shareWeek = async () => {
    const planned = DAYS.filter(d => plan[d]).map(d => {
      const m = meals.find(x => x.id === plan[d]);
      return m ? {day: d, name: m.name, sub: m.subcategory, time: m.cookingTime || '', ingredients: m.ingredients} : null;
    }).filter(Boolean);
    if (!planned.length) return;

    // Build url with embedded JSON for shared link
    const data = {ts: Date.now().toString(36), days: planned};
    const url = window.location.origin + window.location.pathname + '#weekly=' + btoa(JSON.stringify(data));

    const lines = [`🍽 This week's meals`, ''];
    planned.forEach(p => lines.push(`${DAY_FULL[p.day]} — ${p.name}${p.time ? ' (' + p.time + ')' : ''}`));
    lines.push('', '🛒 Shopping list', '');
    const grouped = {};
    ING_CAT_ORDER.forEach(c => grouped[c] = []);
    planned.forEach(p => p.ingredients.forEach(ing => grouped[categorizeIng(ing)].push(ing)));
    ING_CAT_ORDER.forEach(c => grouped[c] = [...new Set(grouped[c])]);
    for (const cat of ING_CAT_ORDER) {
      if (!grouped[cat].length) continue;
      lines.push(cat.toUpperCase());
      grouped[cat].forEach(ing => lines.push('• ' + ing));
      lines.push('');
    }
    lines.push('Tick items off as you shop:', url);
    const txt = lines.join('\n');

    if (navigator.share) {
      try { await navigator.share({title: "This week's meals", text: txt, url}); return; } catch(e) {}
    }
    try { await navigator.clipboard.writeText(txt); toast('✓ Copied! Paste into a message.'); }
    catch {
      const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      toast('✓ Copied! Paste into a message.');
    }
  };

  const exportLib = () => {
    if (!meals.length) { alert('No recipes to export!'); return; }
    const b = new Blob([JSON.stringify({exported: new Date().toISOString(), version: 5, meals}, null, 2)], {type: 'application/json'});
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u; a.download = `family-clean-eats-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(u);
    toast('✓ Downloaded!');
  };

  const importLib = e => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        const inc = data.meals || (Array.isArray(data) ? data : []);
        if (!inc.length) { alert('No recipes found in this file.'); return; }
        setMeals(ms => {
          const ex = new Set(ms.map(m => m.name.toLowerCase().trim()));
          const fresh = inc.filter(m => !ex.has(m.name.toLowerCase().trim()));
          toast(`✓ Added ${fresh.length} recipes${inc.length - fresh.length ? ` (${inc.length - fresh.length} skipped)` : ''}`);
          return [...ms, ...fresh];
        });
      } catch { alert('Could not read this file.'); }
      e.target.value = '';
    };
    r.readAsText(file);
  };

  const exportNotes = async () => {
    const sm = meals.filter(m => sel.has(m.id)); if (!sm.length) return;
    const grouped = {}; ING_CAT_ORDER.forEach(c => grouped[c] = []);
    sm.forEach(m => m.ingredients.forEach(ing => grouped[categorizeIng(ing)].push(ing)));
    const date = new Date().toLocaleDateString('en-AU', {weekday:'long', day:'numeric', month:'long'});
    const lines = ['Shopping List', date, '', 'Meals: ' + sm.map(m => m.name).join(', '), ''];
    for (const cat of ING_CAT_ORDER) {
      if (!grouped[cat].length) continue;
      lines.push(cat.toUpperCase());
      grouped[cat].forEach(ing => lines.push(ing));
      lines.push('');
    }
    const txt = lines.join('\n');
    if (navigator.share) { try { await navigator.share({title: 'Shopping List', text: txt}); return; } catch(e) {} }
    try { await navigator.clipboard.writeText(txt); } catch(err) {
      const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    }
    toast('✓ Copied! Paste into Apple Notes.');
  };

  const importNotes = (txt, done) => {
    if (!txt.trim()) { alert('Please paste your recipes first.'); return; }
    const CAT_KEYS = Object.keys(CATS);
    const matchCat = v => {
      const t = (v||'').trim(); if (!t) return ['Dinner', false];
      const h = CAT_KEYS.find(k => k.toLowerCase() === t.toLowerCase());
      return [h || 'Dinner', !h];
    };
    const matchSub = (cat, v) => {
      const subs = CATS[cat] || []; const t = (v||'').trim(); if (!t) return ['Other', false];
      const h = subs.find(s => s.toLowerCase() === t.toLowerCase());
      return [h || 'Other', !h];
    };
    const parseStructured = blk => {
      const ls = blk.trim().split('\n');
      const m = {id: Date.now()+'-'+Math.random(), name:'', category:'Dinner', subcategory:'Other', cookingTime:'', servings:'', recipe:'', ingredients:[], notes:''};
      let rawCat = '', rawSub = '', sec = '', rec = [], ings = [];
      for (let raw of ls) {
        const l = raw.trim(); if (!l) continue;
        if (/^(Name|Meal):\s*/i.test(l))      m.name = l.replace(/^(Name|Meal):\s*/i, '');
        else if (/^Category:\s*/i.test(l))    rawCat = l.replace(/^Category:\s*/i, '');
        else if (/^Subcategory:\s*/i.test(l)) rawSub = l.replace(/^Subcategory:\s*/i, '');
        else if (/^Time:\s*/i.test(l))        m.cookingTime = l.replace(/^Time:\s*/i, '');
        else if (/^Servings:\s*/i.test(l))    m.servings = l.replace(/^Servings:\s*/i, '');
        else if (/^Notes:\s*/i.test(l))       { m.notes = l.replace(/^Notes:\s*/i, ''); sec = ''; }
        else if (/^Recipe:\s*$/i.test(l))     sec = 'r';
        else if (/^Ingredients:\s*$/i.test(l)) sec = 'i';
        else if (sec === 'r') rec.push(l);
        else if (sec === 'i') ings.push(l);
      }
      m._rawCat = rawCat; m._rawSub = rawSub;
      m.recipe = rec.join(' '); m.ingredients = ings.filter(Boolean); return m;
    };
    const parseSmart = blk => {
      const lines = blk.trim().split('\n').map(s=>s.trim()).filter(Boolean);
      if (!lines.length) return null;
      const isJunk = l => /^(?:page\s*\d+|\d+\s*$|photograph\s+by|recipe\s+by|from\s+the\s+kitchen|©|copyright|all\s+rights\s+reserved)/i.test(l);
      const isSectionHdr = l => /^(?:method|ingredients?|directions?|instructions?|preparation|prep|steps?|recipe|notes?)[\s:]*$/i.test(l);
      const servingsRx = /(?:^|\s)(?:serves|makes|servings?|portions?|yield)[\s:]+(\d+)/i;
      const timeRx = /(?:prep|cook|cooking|total|ready\s+in)(?:\s*time)?[\s:]+(\d+(?:[.,]\d+)?\s*(?:hours?|hrs?|h\b|minutes?|mins?|m\b))/i;
      const qtyStartRx = /^(?:\d+(?:[.,/]\d+)?|\d+\s*-\s*\d+|[¼½¾⅓⅔⅛⅜⅝⅞]|a\s+(?:pinch|dash|handful|few)\b|an?\s)/i;
      const unitRx = /\b(?:cups?|tbsps?|tablespoons?|tsps?|teaspoons?|grams?|kilograms?|g|kg|mls?|millilitres?|millile?ters?|litres?|liters?|l|oz|ounces?|lbs?|pounds?|pinch(?:es)?|dash(?:es)?|cloves?|cans?|jars?|sprigs?|slices?|pieces?|sticks?|packets?|bunches?|heads?|bottles?|handful)\b/i;
      const numberedStepRx = /^(?:\d+[.):]|step\s+\d+)/i;
      const verbStartRx = /^(?:heat|add|combine|mix|whisk|stir|simmer|bake|cook|saut[eé]|fry|grill|roast|brown|chop|dice|slice|mince|crush|pour|drain|drizzle|toss|fold|knead|rest|serve|preheat|season|cover|reduce|remove|return|transfer|let|garnish|sprinkle|spread|place|put|cool|chill|refrigerate|freeze|microwave|boil|steam|set\s+aside|once|when|until|in\s+a\s+(?:pan|pot|bowl|dish|skillet))/i;
      const classify = l => {
        if (isJunk(l) || isSectionHdr(l)) return 'junk';
        if (numberedStepRx.test(l)) return 'method';
        if ((servingsRx.test(l) || timeRx.test(l)) && l.length < 50) return 'meta';
        if (qtyStartRx.test(l) && l.length < 100) return 'ingredient';
        if (unitRx.test(l) && l.length < 60) return 'ingredient';
        if (l.length > 80) return 'method';
        if (verbStartRx.test(l) && l.length > 12) return 'method';
        return 'unknown';
      };
      const classes = lines.map(classify);
      let servings = '', cookTime = '';
      for (let i = 0; i < lines.length; i++) {
        if (classes[i] !== 'meta') continue;
        const sm = lines[i].match(servingsRx); if (sm && !servings) servings = sm[1];
        const tm = lines[i].match(timeRx); if (tm && !cookTime) cookTime = tm[1].replace(/\s+/g, ' ');
      }
      let titleIdx = -1, name = '';
      for (let i = 0; i < Math.min(lines.length, 8); i++) {
        const c = classes[i];
        if (c === 'junk') continue;
        if (c === 'ingredient' || c === 'method') break;
        if (c === 'meta') continue;
        if (lines[i].length > 70) continue;
        name = lines[i]; titleIdx = i; break;
      }
      const ings = [], methodParts = [];
      let sawIng = false, sawMethod = false;
      for (let i = 0; i < lines.length; i++) {
        if (i === titleIdx) continue;
        const l = lines[i], c = classes[i];
        if (c === 'junk' || c === 'meta') continue;
        if (c === 'ingredient') { ings.push(l); sawIng = true; }
        else if (c === 'method') { methodParts.push(l); sawMethod = true; }
        else {
          if (sawMethod) methodParts.push(l);
          else if (sawIng && l.length < 60) ings.push(l);
          else if (sawIng) methodParts.push(l);
        }
      }
      if (!ings.length && !methodParts.length) return null;
      if (!name) name = 'Untitled recipe';
      return {
        id: Date.now() + '-' + Math.random(),
        name, category: 'Dinner', subcategory: 'Other',
        cookingTime: cookTime, servings,
        recipe: methodParts.join(' '),
        ingredients: ings,
        notes: '', _smart: true,
      };
    };
    let adjusted = 0, smartCount = 0;
    const parsed = txt.split(/={3,}|-{3,}/).map(blk => {
      if (!blk.trim()) return null;
      let m = parseStructured(blk);
      if (!(m.name && m.ingredients.length)) {
        m = parseSmart(blk);
        if (m) smartCount++;
      }
      if (!m) return null;
      const [cat, catAdj] = matchCat(m._rawCat || m.category); m.category = cat;
      const [sub, subAdj] = matchSub(cat, m._rawSub || m.subcategory); m.subcategory = sub;
      if (catAdj || subAdj) adjusted++;
      delete m._rawCat; delete m._rawSub; delete m._smart;
      return m;
    }).filter(m => m && m.name && m.ingredients.length);
    if (!parsed.length) { alert("Couldn't find a recipe in that text. Try a clearer photo or paste with more detail."); return; }
    setMeals(ms => [...ms, ...parsed]);
    done && done();
    const bits = [];
    if (adjusted) bits.push(`${adjusted} adjusted`);
    if (smartCount) bits.push(`${smartCount} auto-parsed — review category`);
    const note = bits.length ? ` (${bits.join(', ')})` : '';
    toast(`✓ Imported ${parsed.length} recipe${parsed.length!==1?'s':''}${note}!`);
  };

  const isForm = view === 'add' || view === 'edit';

  if (sharedData) return <SharedView data={sharedData}/>;

  return (
    <>
      <header className="hdr">
        {isForm ? (
          <button className="hdr-btn" onClick={()=>{setEditM(null); setView('library');}} aria-label="Back">
            <ICON.Back/>
          </button>
        ) : (
          <button className="hdr-btn" onClick={()=>setMenuOpen(true)} aria-label="Menu">
            <ICON.Menu/>
          </button>
        )}
        <div className="wm">Family <em>Clean</em> Eats</div>
        {sel.size > 0 && view === 'library' && (
          <div className="hdr-pill">{sel.size}</div>
        )}
        {!isForm && view === 'library' && (
          <button className="hdr-btn" onClick={()=>searchRef.current?.focus()} aria-label="Search">
            <ICON.Search/>
          </button>
        )}
      </header>

      {view === 'library' && (
        <Library
          meals={meals} favs={favs} sel={sel} plan={plan}
          onChk={togSel} onFav={togFav} onOpen={m => setDetail(m)}
          onAdd={()=>{setEditM(null); setView('add');}}
          onImport={importNotes}
          onClearSel={()=>setSel(new Set())}
          searchRef={searchRef}
          onShowImp={()=>setImportOpen(true)}
        />
      )}
      {view === 'plan' && (
        <Plan
          meals={meals} plan={plan}
          onSet={planDay} onClear={d => setPlan(p => ({...p, [d]: null}))} onShare={shareWeek}
        />
      )}
      {view === 'shopping' && (
        <Shopping
          meals={meals} sel={sel} ckd={ckd}
          onTog={togCkd} onExport={exportNotes} onClearCkd={()=>setCkd(new Set())}
        />
      )}
      {view === 'share' && (
        <Share count={meals.length} onExport={exportLib} onImport={importLib} onShareWeek={shareWeek} hasPlan={DAYS.some(d => plan[d])}/>
      )}
      {isForm && (
        <AddEdit init={editM} onSave={saveR} onCancel={()=>{setEditM(null); setView('library');}}/>
      )}

      {detail && (
        <Detail
          meal={detail} fav={favs.has(detail.id)} sel={sel.has(detail.id)}
          onClose={()=>setDetail(null)}
          onFav={togFav} onSel={togSel}
          onEdit={()=>{setEditM(detail); setDetail(null); setView('edit');}}
          onDel={()=>delR(detail.id)}
          onCopyIngs={async()=>{
            const txt = detail.ingredients.join('\n');
            try { await navigator.clipboard.writeText(txt); } catch {
              const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
              document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
            }
            toast('✓ Ingredients copied!');
          }}
        />
      )}

      {menuOpen && (
        <HeaderMenu
          onClose={()=>setMenuOpen(false)}
          onAdd={()=>{setEditM(null); setView('add');}}
          onImport={()=>setImportOpen(true)}
          onExport={exportLib}
          onSharePlan={shareWeek}
          hasPlan={DAYS.some(d => plan[d])}
        />
      )}

      {importOpen && (
        <ImportSheet onClose={()=>setImportOpen(false)} onImport={importNotes} toast={toast}/>
      )}

      {!isForm && (
        <nav className="bnav">
          <button className={`ntab${view==='library'?' on':''}`} onClick={()=>{setDetail(null); setView('library');}}>
            <ICON.Book/>
            <span>Library</span>
          </button>
          <button className={`ntab${view==='plan'?' on':''}`} onClick={()=>{setDetail(null); setView('plan');}}>
            <ICON.Cal/>
            <span>Plan</span>
          </button>
          <button className="nfab" onClick={()=>{setDetail(null); setEditM(null); setView('add');}} aria-label="Add recipe">
            <div className="nfab-inner"><ICON.Plus/></div>
          </button>
          <button className={`ntab${view==='shopping'?' on':''}`} onClick={()=>{setDetail(null); setView('shopping');}}>
            <ICON.Cart/>
            <span>Shop</span>
            {sel.size > 0 && <div className="nbadge">{sel.size}</div>}
          </button>
          <button className={`ntab${view==='share'?' on':''}`} onClick={()=>{setDetail(null); setView('share');}}>
            <ICON.Share/>
            <span>Share</span>
          </button>
        </nav>
      )}

      <div className={`toast${vis?' show':''}`}>{msg}</div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
